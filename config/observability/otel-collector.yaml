# Empfängt OTLP vom OpenClaw-Gateway (Traces/Metriken/Logs) und exportiert
# Metriken an Prometheus. Logs/Traces: vorerst Debug-Export (siehe logging-Exporter);
# Backend dafür (Loki/Tempo) ist bewusst nicht Teil dieses Schnitts.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
