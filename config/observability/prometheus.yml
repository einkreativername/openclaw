global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]   # Gateway-Metriken via OTLP->Prometheus

  # Optional: Gateway direkt scrapen (authentifizierte Route).
  # Token kommt NICHT in diese Datei, sondern in config/observability/gateway-token
  # (erzeugt durch scripts/host/setup-gateway-scrape.sh aus der .env):
  # - job_name: openclaw-gateway
  #   scheme: http
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["openclaw-gateway:18789"]
  #   authorization:
  #     type: Bearer
  #     credentials_file: /etc/prometheus/gateway-token
